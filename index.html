<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jordan Elliott - Personal Site</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">Jordan E</div>
    <nav class="nav" aria-label="Main">
      <a href="#top">Top</a>
      <a href="#about">About</a>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌓</button>
    </nav>
  </header>
  <main id="top">
    <section class="hero" aria-label="Intro">
      <div class="hero-inner">
        <h1>Jordan Elliott</h1>
        <p>Frontend engineer building accessible, fast web experiences.</p>
        <button class="cta" data-scroll-to="#work">See projects</button>
      </div>
    </section>
    <section id="about" class="panel"><h2>About</h2><p>Curious professional who values clarity and performance.</p></section>
    <section id="work" class="panel"><h2>Selected Work</h2><ul class="grid"><li class="card">Progressive UI patterns</li><li class="card">Performance audits</li><li class="card">Accessible components</li></ul></section>
    <section id="contact" class="panel"><h2>Contact</h2><form id="contactForm" autocomplete="on"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Message<textarea name="message" rows="4" required></textarea></label><button type="submit">Send</button></form><p id="formStatus" class="status" aria-live="polite"></p></section>
  </main>
  <footer class="site-footer">© 2024 Jordan Elliott</footer>
  <script src="script.js"></script>
</body>
</html>
